name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          mkdir -p dist/social2wp
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='build.ps1' \
            --exclude='README.md' \
            . dist/social2wp/
          cd dist
          zip -r social2wp-${{ github.ref_name }}.zip social2wp/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/social2wp-${{ github.ref_name }}.zip
          generate_release_notes: true
